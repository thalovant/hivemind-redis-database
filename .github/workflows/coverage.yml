permissions:
  # The pinned reusable workflow declares contents:write for its optional
  # Pages path; GitHub validates that permission even when Pages is disabled.
  contents: write
  pull-requests: write

name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_redis_database'
      pre_install_pip: '"hivemind-plugin-manager==0.6.0a1"'
      test_path: 'tests/ --ignore=tests/e2e'
      install_extras: ''
      min_coverage: 0
      pr_comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
