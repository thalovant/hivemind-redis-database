permissions:
  contents: read
  pull-requests: write
  security-events: write

name: PIP Audit

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  pip_audit:
    uses: OpenVoiceOS/gh-automations/.github/workflows/pip-audit.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      pr_comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
