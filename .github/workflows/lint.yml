permissions:
  contents: read
  pull-requests: write

name: Lint

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  lint:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      ruff: true
      pre_commit: false   # set true if .pre-commit-config.yaml exists
      pr_comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

  ruff-enforce:
    name: Ruff enforcement
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Enforce Ruff findings
        run: ruff check . --exclude _gh_automations
