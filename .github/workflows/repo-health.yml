permissions:
  contents: read
  pull-requests: write

name: Repo Health

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  repo_health:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: OpenVoiceOS/gh-automations/.github/workflows/repo-health.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      version_file: 'hivemind_redis_database/version.py'
