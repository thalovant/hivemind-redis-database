[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-redis-database"
description = "Redis database plugin for HiveMind core with RediSearch support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
keywords = ["hivemind", "redis", "database", "plugin"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Patched classic FileLock compatible with combo-lock's filelock~=3.0.
    "filelock==3.20.3",
    # The supported bus client still imports BitStream, removed in bitstring 5.
    "bitstring>=4.1.1,<5",
    "redis>=4.2.0",
    "hiredis>=2.0.0",
    # This legacy schema is validated against the pre-0.9 Client representation.
    "hivemind-plugin-manager>=0.6.0a1,<0.9",
    "hivemind-bus-client>=0.4.4",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-redis-database"
Repository = "https://github.com/JarbasHiveMind/hivemind-redis-database"
Issues = "https://github.com/JarbasHiveMind/hivemind-redis-database/issues"

[project.entry-points."hivemind.database"]
hivemind-redis-db-plugin = "hivemind_redis_database:RedisDB"

[project.scripts]
hivemind-redis-migrate-cluster = "hivemind_redis_database.migration:main"

[project.optional-dependencies]
fast = [
    "orjson>=3.9",
]
test = [
    "pytest>=7.0",
    "fakeredis>=2.0",
    # Match the existing policy-E2E stack and its legacy connection constructor.
    "hivescope==0.4.0a2",
    "hivemind-core==4.3.0a2",
    "hivemind-ovos-agent-plugin==0.2.0a1",
    "hivemind-plugin-manager==0.6.0a1",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.dynamic]
version = { attr = "hivemind_redis_database.version.__version__" }
